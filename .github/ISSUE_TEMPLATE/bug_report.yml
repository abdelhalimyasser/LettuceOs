name: Bug Report
description: Report an unexpected fault, regression, or build error in Lettuce
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with the Lettuce research OS prototype.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what failed.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Execution Environment
      options:
        - Host Linux (x86_64)
        - Bare-Metal ARM64 under QEMU virt
        - CI / GitHub Actions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal commands to trigger the issue.
      value: |
        1. Compile with ...
        2. Run ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Serial / Console Logs
      description: Relevant output logs, exception ESR/FAR/ELR values, or compiler errors.
      render: shell
